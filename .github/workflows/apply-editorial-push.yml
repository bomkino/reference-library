name: Apply editorial shortlist and compare push

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/editorial-push/**
      - .github/workflows/apply-editorial-push.yml

permissions:
  contents: write

concurrency:
  group: reference-library-editorial-push
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Reconstruct and apply reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/editorial-push/editorial-push.patch.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/editorial-push.patch"
          printf '%s  %s\n' \
            '9d565b654b75abd6b2390bb12fe3418970cbb5effc3b8b55617b5bd2bdf47838' \
            "$RUNNER_TEMP/editorial-push.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/editorial-push.patch"
          git apply "$RUNNER_TEMP/editorial-push.patch"
          git diff --check

      - name: Remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/editorial-push
          rm -f .github/workflows/apply-editorial-push.yml

      - name: Use repository Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run focused source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python3 scripts/check_repository.py
          node scripts/generate-product-icon.mjs --check
          node scripts/check-release-metadata.mjs
          npm run typecheck
          npm run test -w @pitchdog/reference-workspace
          node --test apps/macos/contract-tests/*.test.mjs scripts/tests/linux-runtime-smoke.test.mjs

      - name: Commit reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add editorial shortlist and compare"
          git push origin HEAD:codex/reference-library-feature-parity
