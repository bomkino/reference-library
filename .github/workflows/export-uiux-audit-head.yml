name: Export UIUX audit head

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/export-uiux-audit-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/HEAD_SHA"
          tar --exclude=.git --exclude=.github/workflows/export-uiux-audit-head.yml -czf "$RUNNER_TEMP/reference-library-uiux-audit.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum reference-library-uiux-audit.tar.gz > reference-library-uiux-audit.tar.gz.sha256
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-library-uiux-audit
          path: |
            ${{ runner.temp }}/reference-library-uiux-audit.tar.gz
            ${{ runner.temp }}/reference-library-uiux-audit.tar.gz.sha256
            ${{ runner.temp }}/HEAD_SHA
          if-no-files-found: error
          retention-days: 1
