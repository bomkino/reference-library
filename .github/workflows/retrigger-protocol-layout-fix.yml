name: Retrigger protocol layout fix

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/retrigger-protocol-layout-fix.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity
      - name: Touch causal workflow and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# retriggered after schema-v4 migration fixture repair\n' >> .github/workflows/fix-protocol-command-layout.yml
          rm -f .github/workflows/retrigger-protocol-layout-fix.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: rerun protocol and source-truth repair"
          git push origin HEAD:codex/reference-library-feature-parity
