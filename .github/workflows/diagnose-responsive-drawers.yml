name: Diagnose responsive drawer geometry

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/uiux-geometry/**
      - .github/workflows/diagnose-responsive-drawers.yml

permissions:
  contents: write

concurrency:
  group: reference-library-responsive-geometry
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build -w @pitchdog/reference-workspace

      - name: Measure real Electron geometry
        shell: bash
        env:
          PRELOAD: ${{ github.workspace }}/.github/uiux-geometry/preload.cjs
          INDEX_HTML: ${{ github.workspace }}/packages/workspace/dist/index.html
          DIAGNOSTIC_FILE: ${{ runner.temp }}/responsive-drawer-geometry.json
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1200x24" ./node_modules/.bin/electron .github/uiux-geometry/diagnose.cjs --no-sandbox
          cat "$DIAGNOSTIC_FILE"

      - name: Remove diagnostic machinery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/uiux-geometry
          rm -f .github/workflows/diagnose-responsive-drawers.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore: remove responsive geometry probe"
            git push origin HEAD:codex/reference-library-feature-parity
          fi

      - name: Upload geometry report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-library-responsive-geometry
          path: ${{ runner.temp }}/responsive-drawer-geometry.json
          if-no-files-found: warn
          retention-days: 1
