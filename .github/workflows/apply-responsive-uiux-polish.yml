name: Apply responsive UIUX polish

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/uiux-responsive/responsive-polish.patch.gz.b64
      - .github/workflows/apply-responsive-uiux-polish.yml

permissions:
  contents: write

concurrency:
  group: reference-library-responsive-uiux-polish
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature-parity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0

      - name: Apply reviewed responsive delta
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n' < .github/uiux-responsive/responsive-polish.patch.gz.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/responsive-polish.patch.gz"
          echo "afc6d8fac2d3bf17ddb39beeb55d2665b183da06cafd91f0a488852e64cf58ad  $RUNNER_TEMP/responsive-polish.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/responsive-polish.patch.gz" \
            > "$RUNNER_TEMP/responsive-polish.patch"
          echo "b253aff224c24239a4803e1e032ff73e3bf08590e7a1b11ade5fe530161596bd  $RUNNER_TEMP/responsive-polish.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/responsive-polish.patch"
          git apply "$RUNNER_TEMP/responsive-polish.patch"

          python3 - <<'PY'
          from pathlib import Path

          test = Path("scripts/tests/linux-runtime-smoke.test.mjs")
          source = test.read_text()
          old = '    heading: "Your project’s visual memory.",'
          new = '    heading: "Build the visual memory for one deck.",'
          if source.count(old) != 1:
              raise SystemExit(f"expected one packaged-journey heading fixture, found {source.count(old)}")
          test.write_text(source.replace(old, new, 1))
          PY

          rm -rf .github/uiux-responsive
          rm -f .github/workflows/apply-responsive-uiux-polish.yml
          git diff --check

      - name: Verify source and journeys
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          cargo build --locked -p reference-core
          npm test
          npm run build
          python3 scripts/check_repository.py

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(workspace): settle responsive editorial chrome"
          git push origin HEAD:codex/reference-library-feature-parity
