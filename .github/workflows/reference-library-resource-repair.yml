name: Reference Library resource-control repair

on:
  push:
    branches:
      - codex/reference-library-fix-2026-08-28

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.90.0"
          components: rustfmt
      - name: Apply audited repair
        run: python3 .github/reference-library-resource-repair.py
      - name: Verify focused repair
        run: |
          python3 scripts/check_repository.py
          cargo fmt --all -- --check
          cargo test -p reference-core finished_resource_control_is_reaped_after_terminal_persistence_failure
          git diff --check
      - name: Commit source repair
        shell: bash
        run: |
          rm .github/reference-library-resource-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): release completed rendition controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"
