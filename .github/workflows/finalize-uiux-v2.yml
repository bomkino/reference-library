name: Finalize UIUX v2

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/finalize-uiux-v2.yml

permissions:
  contents: write

concurrency:
  group: reference-library-final-uiux-v2
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact feature-parity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply reviewed source and exact accessibility repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/apply-final-uiux.yml').read_text().splitlines()
          step = lines.index('      - name: Apply the reviewed UIUX delta')
          run = next(index for index in range(step + 1, len(lines)) if lines[index].strip() == 'run: |')
          end = next(index for index in range(run + 1, len(lines)) if lines[index].startswith('      - name: Verify the complete workspace'))
          script = textwrap.dedent('\n'.join(lines[run + 1:end]))
          Path('/tmp/apply-reviewed-uiux.sh').write_text('set -euo pipefail\n' + script + '\n')
          PY
          bash /tmp/apply-reviewed-uiux.sh

          python3 - <<'PY'
          from pathlib import Path

          toolbar = Path('packages/workspace/src/query-toolbar.tsx')
          source = toolbar.read_text()
          root_old = '<select disabled={props.disabled} value={props.query.rootId ?? ""}'
          root_new = '<select aria-label="Root" disabled={props.disabled} value={props.query.rootId ?? ""}'
          if source.count(root_old) != 1:
              raise SystemExit(f'expected one Root select seam, found {source.count(root_old)}')
          source = source.replace(root_old, root_new, 1)

          for label in ('Review', 'Source'):
              marker = f'<span>{label}</span>'
              start = source.index(marker)
              select_start = source.index('<select', start)
              disabled = source.index('disabled={props.disabled}', select_start)
              source = source[:disabled] + f'aria-label="{label}"\n                ' + source[disabled:]
          toolbar.write_text(source)

          test = Path('packages/workspace/src/app.keyboard.integration.test.tsx')
          tests = test.read_text()
          start = tests.index('function select(name: string')
          end = tests.index('\nfunction hostNode()', start)
          replacement = '''function select(name: string, scope: ParentNode = hostNode()): HTMLSelectElement {
            const found = [...scope.querySelectorAll<HTMLSelectElement>("select")].find((element) => {
              if (element.getAttribute("aria-label") === name) return true;
              const directLabel = element.closest("label")?.querySelector<HTMLElement>(":scope > span")?.textContent?.trim();
              return directLabel === name;
            });
            if (!found) throw new Error(`select not found: ${name}`);
            return found;
          }'''
          test.write_text(tests[:start] + replacement + tests[end:])
          PY

          rm -f .github/workflows/finalize-uiux-v2.yml
          git diff --check

      - name: Verify the complete workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          python3 scripts/check_repository.py

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(workspace): complete the editorial UIUX journey"
          git push origin HEAD:codex/reference-library-feature-parity
