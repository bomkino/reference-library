name: Export UIUX baseline 191

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/export-uiux-baseline-191.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: 1918726d09f9e304a8a04cd48861802128a1a6e8
      - name: Package baseline
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "1918726d09f9e304a8a04cd48861802128a1a6e8" > "$RUNNER_TEMP/HEAD_SHA"
          tar --exclude=.git -czf "$RUNNER_TEMP/reference-library-uiux-baseline-191.tar.gz" .
      - name: Upload baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-library-uiux-baseline-191
          path: |
            ${{ runner.temp }}/reference-library-uiux-baseline-191.tar.gz
            ${{ runner.temp }}/HEAD_SHA
          if-no-files-found: error
          retention-days: 1
