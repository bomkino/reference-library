name: Reference Library repair bootstrap

on:
  push:
    branches:
      - codex/reference-library-fix-2026-08-28

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply audited repair
        run: python3 .github/reference-library-repair.py
      - name: Verify repair boundary
        run: |
          python3 scripts/check_repository.py
          git diff --check
      - name: Commit non-workflow repair
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows/ci.yml
          rm .github/reference-library-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden lifecycle and repository maintenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
