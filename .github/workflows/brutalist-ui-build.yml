name: Brutalist interface rebuild

on:
  push:
    branches:
      - codex/reference-library-brutalist-ui

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Apply final interaction repair
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/bomkino/reference-library/codex/reference-library-final-gauntlet-v2/.github/final-gauntlet-v2-repair.py \
            --output "$RUNNER_TEMP/final-gauntlet-v2-repair.py"
          python3 "$RUNNER_TEMP/final-gauntlet-v2-repair.py"
      - name: Apply oversized brutalist interface
        run: python3 .github/brutalist-ui-repair.py
      - name: Generate exact product icon derivatives
        run: node scripts/generate-product-icon.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository and generated assets
        run: |
          python3 scripts/check_repository.py
          node scripts/generate-product-icon.mjs --check
          node scripts/check-release-metadata.mjs
          python3 scripts/generate_dependency_licenses.py --check
          node scripts/legal-bundle-contract.mjs --directory .
          git diff --check
      - name: Verify shared workspace and Linux source
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Verify Rust public seams
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          node scripts/t01-semantic-roundtrip.mjs --core target/debug/reference-core
          node scripts/v1-semantic-roundtrip.mjs --core target/debug/reference-core
      - name: Commit verified product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md \
            assets/branding \
            docs/evidence/DECISION_EVIDENCE_LOG.md \
            docs/product/BRUTALIST_INTERFACE_SYSTEM.md \
            packages/workspace/src \
            scripts/generate-product-icon.mjs
          git diff --cached --check
          git commit -m 'feat: rebuild Reference Library as an oversized brutalist workspace'
          git push origin "HEAD:${GITHUB_REF_NAME}"
