name: Apply UIUX polish

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/uiux-polish/uiux-polish.patch.gz.b64.part-*
      - .github/workflows/apply-uiux-polish.yml

permissions:
  contents: write

concurrency:
  group: reference-library-uiux-polish
  cancel-in-progress: false

jobs:
  apply-verify-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0

      - name: Apply reviewed UIUX delta
        shell: bash
        run: |
          set -euo pipefail
          echo "74064d0be49869c474ea05b38bbbc362f8ce8347a05eef758c7e5562f35fbcca  .github/uiux-polish/uiux-polish.patch.gz.b64.part-00" | sha256sum --check --strict
          echo "d4fe76ab7bfab0bc476efce85b58f8e321812ff0ef5c8eed910014cf98912376  .github/uiux-polish/uiux-polish.patch.gz.b64.part-01" | sha256sum --check --strict
          echo "e812341a54fceec5c4b98398be370acab5ef5fe6b539b4dbdc7c5a2eb63761db  .github/uiux-polish/uiux-polish.patch.gz.b64.part-02" | sha256sum --check --strict
          echo "d8c0370d57e9c4c97734ad2a30fd85e14dd0385666afbf21b2d83ac063d3de2c  .github/uiux-polish/uiux-polish.patch.gz.b64.part-03" | sha256sum --check --strict
          cat .github/uiux-polish/uiux-polish.patch.gz.b64.part-* \
            > "$RUNNER_TEMP/uiux-polish.patch.gz.b64"
          echo "b8272aa16476f17ee88372c3bba34db2366ffab9f0f201b07c8fe1e632a65d05  $RUNNER_TEMP/uiux-polish.patch.gz.b64" \
            | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/uiux-polish.patch.gz.b64" \
            > "$RUNNER_TEMP/uiux-polish.patch.gz"
          echo "cac02bde6a8160268877f3afa1e34ac0c39a6349cdf24acbfe659d3230156c48  $RUNNER_TEMP/uiux-polish.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/uiux-polish.patch.gz" \
            > "$RUNNER_TEMP/uiux-polish.patch"
          echo "77efa2fc91cb8546066bae0ae414550c6afc424168bbd674f64d3d7dd2a1e358  $RUNNER_TEMP/uiux-polish.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/uiux-polish.patch"
          git apply "$RUNNER_TEMP/uiux-polish.patch"
          git diff --check

      - name: Verify workspace source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          cargo build --locked -p reference-core
          npm test
          npm run build
          python3 scripts/check_repository.py

      - name: Capture polished journey
        shell: bash
        env:
          PRELOAD: ${{ github.workspace }}/.github/uiux-audit/preload.cjs
          INDEX_HTML: ${{ github.workspace }}/packages/workspace/dist/index.html
          SCREENSHOT_DIR: ${{ runner.temp }}/reference-uiux-polish/screenshots
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOT_DIR"
          xvfb-run -a ./node_modules/.bin/electron .github/uiux-audit/capture.cjs --no-sandbox

      - name: Remove temporary audit machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/uiux-polish
          rm -rf .github/uiux-audit
          rm -f .github/workflows/apply-uiux-polish.yml
          rm -f .github/workflows/export-uiux-audit-head.yml
          rm -f .github/workflows/capture-uiux-audit.yml
          git diff --check

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(workspace): make visual research the primary surface"
          git push origin HEAD:codex/reference-library-feature-parity

      - name: Upload polished screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-library-uiux-polish-screenshots
          path: ${{ runner.temp }}/reference-uiux-polish/screenshots/*.png
          if-no-files-found: warn
          retention-days: 1
