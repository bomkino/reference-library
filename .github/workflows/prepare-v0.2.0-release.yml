name: Prepare Reference Library 0.2.0

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/prepare-v0.2.0-release.yml
      - .github/release-prep/prepare.py
      - .github/release-prep/update-fixtures.py

permissions:
  contents: write

concurrency:
  group: reference-library-prepare-v0.2.0
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Align version, documentation, tests and release automation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release-prep/prepare.py
          python3 .github/release-prep/update-fixtures.py

      - name: Refresh lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          cargo check --workspace

      - name: Remove one-shot preparation machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/release-prep
          rm -f .github/workflows/prepare-v0.2.0-release.yml

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python3 scripts/check_repository.py
          node scripts/generate-product-icon.mjs --check
          node scripts/check-release-metadata.mjs
          npm run typecheck
          cargo build --locked --release -p reference-core
          npm test
          npm run build
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --locked -p reference-core
          python3 scripts/generate_dependency_licenses.py --check
          node scripts/legal-bundle-contract.mjs --directory .
          git diff --check

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare Reference Library 0.2.0"
          git push origin HEAD:codex/reference-library-feature-parity
