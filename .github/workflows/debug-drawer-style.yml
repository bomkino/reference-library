name: Debug drawer computed style

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/debug-drawer-style.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/reference-library-feature-parity
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install and build workspace
        run: |
          npm ci --ignore-scripts
          npm run build -w @pitchdog/reference-workspace
      - name: Inspect computed drawer geometry
        shell: bash
        env:
          PRELOAD: ${{ github.workspace }}/.github/uiux-audit/preload.cjs
          INDEX_HTML: ${{ github.workspace }}/packages/workspace/dist/index.html
        run: |
          cat > "$RUNNER_TEMP/debug-drawer.cjs" <<'EOF'
          const { app, BrowserWindow } = require('electron');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          app.commandLine.appendSwitch('no-sandbox');
          app.commandLine.appendSwitch('disable-gpu');
          app.whenReady().then(async () => {
            const window = new BrowserWindow({ width: 720, height: 1100, show: false, webPreferences: { preload: process.env.PRELOAD, contextIsolation: true, nodeIntegration: false, sandbox: false } });
            await window.loadFile(process.env.INDEX_HTML);
            await wait(500);
            await window.webContents.executeJavaScript(`(() => { const input=document.querySelector('[aria-label="Library name"]'); const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set; setter.call(input,'Debug'); input.dispatchEvent(new Event('input',{bubbles:true})); [...document.querySelectorAll('.document-empty button')].find(b=>b.textContent.includes('Create')).click(); })()`);
            await wait(700);
            await window.webContents.executeJavaScript(`document.querySelector('[data-asset-id="asset-1"]').click()`);
            await wait(300);
            await window.webContents.executeJavaScript(`[...document.querySelectorAll('.topbar__primary-actions button')].find(b=>b.textContent.trim()==='Library').click()`);
            await wait(300);
            const result = await window.webContents.executeJavaScript(`(() => {
              const node=document.querySelector('.sidebar'); const style=getComputedStyle(node); const rect=node.getBoundingClientRect();
              return {
                innerWidth: window.innerWidth,
                visualViewport: window.visualViewport && {width:window.visualViewport.width,scale:window.visualViewport.scale},
                dpr: window.devicePixelRatio,
                rootFont:getComputedStyle(document.documentElement).fontSize,
                media760:matchMedia('(max-width: 760px)').matches,
                media1320:matchMedia('(max-width: 1320px)').matches,
                className:node.className,
                width:style.width,
                inlineSize:style.inlineSize,
                maxWidth:style.maxWidth,
                maxInlineSize:style.maxInlineSize,
                boxSizing:style.boxSizing,
                position:style.position,
                transform:style.transform,
                left:style.left,
                right:style.right,
                rect:{left:rect.left,right:rect.right,width:rect.width},
                rules:[...document.styleSheets].flatMap(sheet=>{try{return [...sheet.cssRules]}catch{return[]}}).filter(rule=>rule.cssText?.includes('.sidebar, .inspector')).map(rule=>rule.cssText),
              };
            })()`);
            console.log('DRAWER_COMPUTED', JSON.stringify(result, null, 2));
            await window.close(); app.quit();
          }).catch(error => { console.error(error); app.exit(1); });
          EOF
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./node_modules/.bin/electron "$RUNNER_TEMP/debug-drawer.cjs" --no-sandbox
