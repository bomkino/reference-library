name: Apply editorial decision-loop push

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/editorial-decision-loop/decision-loop.patch.gz.part-*
      - .github/workflows/apply-editorial-decision-loop.yml

permissions:
  contents: write

concurrency:
  group: reference-library-editorial-decision-loop
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Apply reviewed product delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/editorial-decision-loop/decision-loop.patch.gz.part-* \
            > "$RUNNER_TEMP/editorial-decision-loop.patch.gz"
          echo "1c6b36cc8bc4740edb2a51d14ee177e4e9b88290f908a15ecdce371334cc9f14  $RUNNER_TEMP/editorial-decision-loop.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/editorial-decision-loop.patch.gz" \
            > "$RUNNER_TEMP/editorial-decision-loop.patch"
          echo "ce9a7225ad2a6a59983f91fabc11b8eeda6efeb97cd59c964f51a0caea596bfe  $RUNNER_TEMP/editorial-decision-loop.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/editorial-decision-loop.patch"
          git apply "$RUNNER_TEMP/editorial-decision-loop.patch"
          rm -rf .github/editorial-decision-loop
          rm -f .github/workflows/apply-editorial-decision-loop.yml
          rm -f .github/workflows/export-current-head.yml
          git diff --check

      - name: Verify exact source before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          cargo fmt --all -- --check
          python3 scripts/check_repository.py

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete the editorial decision loop"
          git push origin HEAD:codex/reference-library-feature-parity
