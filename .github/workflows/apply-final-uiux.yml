name: Apply final UIUX refinement

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/uiux-final/final-uiux.patch.gz.b64.part-*
      - .github/uiux-final/final-uiux-followup.patch.gz.b64
      - .github/workflows/apply-final-uiux.yml

permissions:
  contents: write

concurrency:
  group: reference-library-final-uiux
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact feature-parity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply the reviewed UIUX delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/uiux-final/final-uiux.patch.gz.b64.part-* \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/final-uiux.patch.gz"
          echo "3622c1bda8ce44d22209518ff5b405f4e8f2947b7e74a1ab30c97c7053524412  $RUNNER_TEMP/final-uiux.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/final-uiux.patch.gz" > "$RUNNER_TEMP/final-uiux.patch"
          echo "dbce231180f7aa58d8df6b79e43bb6eee4758c5b90c0b5c619a5ed2d151583e0  $RUNNER_TEMP/final-uiux.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/final-uiux.patch"
          git apply "$RUNNER_TEMP/final-uiux.patch"

          tr -d '\n' < .github/uiux-final/final-uiux-followup.patch.gz.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/final-uiux-followup.patch.gz"
          echo "884b874aa6a4eb1072b2d7331f566c1955af681b1aeda5dc795a2d6e714ec4aa  $RUNNER_TEMP/final-uiux-followup.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/final-uiux-followup.patch.gz" > "$RUNNER_TEMP/final-uiux-followup.patch"
          echo "02e780782749738801ebb63dc32613ee9d87bef15f153e53eb504686c0c0faf5  $RUNNER_TEMP/final-uiux-followup.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/final-uiux-followup.patch"
          git apply "$RUNNER_TEMP/final-uiux-followup.patch"

          python3 - <<'PY'
          from pathlib import Path
          import re

          toolbar = Path("packages/workspace/src/query-toolbar.tsx")
          source = toolbar.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useRef, useState } from "react";',
              'import { useEffect, useMemo, useState } from "react";',
              1,
          )
          old_signature = '  onChange(query: AssetQuery): void;\n'
          new_signature = '  onChange(update: (query: AssetQuery) => AssetQuery): void;\n'
          if source.count(old_signature) != 1:
              raise SystemExit(f"expected one QueryToolbar onChange signature, found {source.count(old_signature)}")
          source = source.replace(old_signature, new_signature, 1)

          query_ref_block = re.compile(
              r'  const queryRef = useRef\(props\.query\);\n'
              r'  useEffect\(\(\) => setSearch\(props\.query\.search \?\? ""\), \[props\.query\.search\]\);\n'
              r'  useEffect\(\(\) => \{ queryRef\.current = props\.query; \}, \[props\.query\]\);\n'
              r'  const emitChange = \(update: \(query: AssetQuery\) => AssetQuery\) => \{\n'
              r'    const next = update\(queryRef\.current\);\n'
              r'    queryRef\.current = next;\n'
              r'    props\.onChange\(next\);\n'
              r'  \};\n'
          )
          replacement = (
              '  useEffect(() => setSearch(props.query.search ?? ""), [props.query.search]);\n'
              '  const emitChange = (update: (query: AssetQuery) => AssetQuery) => props.onChange(update);\n'
          )
          source, replacements = query_ref_block.subn(replacement, source, count=1)
          if replacements != 1:
              raise SystemExit(f"expected one local query composition block, found {replacements}")

          event_replacements = {
              'onChange={(event) => emitChange((current) => ({ ...current, sort: event.target.value as AssetQuery["sort"] }))}':
                  'onChange={(event) => { const sort = event.target.value as AssetQuery["sort"]; emitChange((current) => ({ ...current, sort })); }}',
              'onChange={(event) => emitChange((current) => ({ ...current, rootId: event.target.value || null }))}':
                  'onChange={(event) => { const rootId = event.target.value || null; emitChange((current) => ({ ...current, rootId })); }}',
              'onChange={(event) => emitChange((current) => ({ ...current, reviewStates: event.target.value ? [event.target.value as ReviewState] : [] }))}':
                  'onChange={(event) => { const reviewState = event.target.value as ReviewState | ""; emitChange((current) => ({ ...current, reviewStates: reviewState ? [reviewState] : [] })); }}',
              'onChange={(event) => emitChange((current) => ({ ...current, availability: event.target.value ? [event.target.value as Availability] : [] }))}':
                  'onChange={(event) => { const availability = event.target.value as Availability | ""; emitChange((current) => ({ ...current, availability: availability ? [availability] : [] })); }}',
          }
          for old_event, new_event in event_replacements.items():
              if source.count(old_event) != 1:
                  raise SystemExit(f"expected one captured filter event seam, found {source.count(old_event)} for {old_event}")
              source = source.replace(old_event, new_event, 1)
          toolbar.write_text(source)

          app = Path("packages/workspace/src/app.tsx")
          app_source = app.read_text()
          old_apply = '  const applyQuery = (next: AssetQuery) => requestTransition("Change the Asset view", () => { setQuery(next); setPreview(null); });\n'
          new_apply = '''  const applyQuery = (update: (query: AssetQuery) => AssetQuery) => requestTransition(
            "Change the Asset view",
            () => { setQuery((current) => update(current)); setPreview(null); },
          );
          '''
          if app_source.count(old_apply) != 1:
              raise SystemExit(f"expected one applyQuery seam, found {app_source.count(old_apply)}")
          app_source = app_source.replace(old_apply, new_apply, 1)

          old_clear = '  const clearAssetView = () => applyQuery({ ...DEFAULT_ASSET_QUERY });\n'
          new_clear = '  const clearAssetView = () => applyQuery(() => ({ ...DEFAULT_ASSET_QUERY }));\n'
          if app_source.count(old_clear) != 1:
              raise SystemExit(f"expected one clear Asset view seam, found {app_source.count(old_clear)}")
          app_source = app_source.replace(old_clear, new_clear, 1)

          old_collection = 'onCollectionChange={(collectionId) => { applyQuery({ ...query, collectionId }); setLibraryDrawerOpen(false); }}'
          new_collection = 'onCollectionChange={(collectionId) => { applyQuery((current) => ({ ...current, collectionId })); setLibraryDrawerOpen(false); }}'
          if app_source.count(old_collection) != 1:
              raise SystemExit(f"expected one Collection filter seam, found {app_source.count(old_collection)}")
          app.write_text(app_source.replace(old_collection, new_collection, 1))

          test = Path("packages/workspace/src/app.keyboard.integration.test.tsx")
          tests = test.read_text()
          replacements = {
              'expect(text()).toContain("Your project’s visual memory.");': 'expect(text()).toContain("Build the visual memory for one deck.");',
              'await waitFor(() => expect(text()).toContain("This Library has no Assets yet"));': 'await waitFor(() => expect(text()).toContain("Start with a project folder."));',
          }
          for old_text, new_text in replacements.items():
              if tests.count(old_text) != 1:
                  raise SystemExit(f"expected one stale copy assertion, found {tests.count(old_text)} for {old_text}")
              tests = tests.replace(old_text, new_text, 1)
          test.write_text(tests)
          PY

          rm -rf .github/uiux-final
          rm -f .github/workflows/apply-final-uiux.yml
          rm -f .github/workflows/export-current-uiux-source.yml
          rm -f .github/workflows/export-uiux-baseline-191.yml
          git diff --check

      - name: Verify the complete workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          python3 scripts/check_repository.py

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(workspace): complete the editorial UIUX journey"
          git push origin HEAD:codex/reference-library-feature-parity
