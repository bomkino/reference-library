name: Apply final UIUX refinement

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/uiux-final/final-uiux.patch.gz.b64.part-*
      - .github/uiux-final/final-uiux-followup.patch.gz.b64
      - .github/workflows/apply-final-uiux.yml

permissions:
  contents: write

concurrency:
  group: reference-library-final-uiux
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact feature-parity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply the reviewed UIUX delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/uiux-final/final-uiux.patch.gz.b64.part-* \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/final-uiux.patch.gz"
          echo "3622c1bda8ce44d22209518ff5b405f4e8f2947b7e74a1ab30c97c7053524412  $RUNNER_TEMP/final-uiux.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/final-uiux.patch.gz" > "$RUNNER_TEMP/final-uiux.patch"
          echo "dbce231180f7aa58d8df6b79e43bb6eee4758c5b90c0b5c619a5ed2d151583e0  $RUNNER_TEMP/final-uiux.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/final-uiux.patch"
          git apply "$RUNNER_TEMP/final-uiux.patch"

          tr -d '\n' < .github/uiux-final/final-uiux-followup.patch.gz.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/final-uiux-followup.patch.gz"
          echo "884b874aa6a4eb1072b2d7331f566c1955af681b1aeda5dc795a2d6e714ec4aa  $RUNNER_TEMP/final-uiux-followup.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/final-uiux-followup.patch.gz" > "$RUNNER_TEMP/final-uiux-followup.patch"
          echo "02e780782749738801ebb63dc32613ee9d87bef15f153e53eb504686c0c0faf5  $RUNNER_TEMP/final-uiux-followup.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/final-uiux-followup.patch"
          git apply "$RUNNER_TEMP/final-uiux-followup.patch"

          rm -rf .github/uiux-final
          rm -f .github/workflows/apply-final-uiux.yml
          rm -f .github/workflows/export-current-uiux-source.yml
          rm -f .github/workflows/export-uiux-baseline-191.yml
          git diff --check

      - name: Verify the complete workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          python3 scripts/check_repository.py

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(workspace): complete the editorial UIUX journey"
          git push origin HEAD:codex/reference-library-feature-parity
