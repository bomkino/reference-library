name: Repair feature-parity gates

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/repair-feature-parity-gates.yml
      - .github/feature-parity-fixture-fixes.patch.gz

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Apply reviewed fixture and smoke repairs
        run: |
          echo "7720c967139180027cc7be19db5de53b099aad825bac2c5979c216fafd7efba6  .github/feature-parity-fixture-fixes.patch.gz" | sha256sum -c -
          gzip -dc .github/feature-parity-fixture-fixes.patch.gz > /tmp/feature-parity-fixture-fixes.patch
          echo "28bc034fa327cc76ab02c41939f2dfb2873c534d5abc277d4ea0ec4eec266db5  /tmp/feature-parity-fixture-fixes.patch" | sha256sum -c -
          git apply --check --binary /tmp/feature-parity-fixture-fixes.patch
          git apply --index --binary /tmp/feature-parity-fixture-fixes.patch
      - name: Format Rust source
        run: |
          cargo fmt --all
          git add crates
          git diff --cached --check
      - name: Remove temporary transport and commit
        run: |
          git rm .github/feature-parity-fixture-fixes.patch.gz .github/workflows/repair-feature-parity-gates.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git commit -m "fix: align feature-parity contracts and gates"
          git push origin HEAD:codex/reference-library-feature-parity
