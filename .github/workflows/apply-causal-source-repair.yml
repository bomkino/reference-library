name: Apply causal source repair

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/apply-causal-source-repair.yml

permissions:
  contents: write

concurrency:
  group: reference-library-causal-source-repair
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature-parity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Apply reviewed causal transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-protocol-command-layout.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(script, 'causal-source-repair.py', 'exec'), {'__name__': '__main__'})

          scanner = Path('crates/reference-core/tests/v1_root_scanner_public_seams.rs')
          source = scanner.read_text()

          broad_start = source.index(
              '#[test]\nfn broad_catalogue_preserves_supported_unsupported_and_corrupt_truth()'
          )
          broad_end = source.index(
              '\n#[test]\nfn full_streaming_evidence_catches_middle_rewrite_but_touch_only_keeps_revision()',
              broad_start,
          )
          broad = source[broad_start:broad_end]
          unreadable = '''        page.items
                      .iter()
                      .filter(|asset| asset.availability == "unreadable")
                      .count(),
                  2
          '''
          unreadable_fixed = '''        page.items
                      .iter()
                      .filter(|asset| asset.availability == "unreadable")
                      .count(),
                  1
          '''
          present = '''        page.items
                      .iter()
                      .filter(|asset| asset.availability == "present")
                      .count(),
                  2
          '''
          present_fixed = '''        page.items
                      .iter()
                      .filter(|asset| asset.availability == "present")
                      .count(),
                  3
          '''
          if broad.count(unreadable) != 1:
              raise SystemExit(f'expected one unreadable count seam, found {broad.count(unreadable)}')
          if broad.count(present) != 1:
              raise SystemExit(f'expected one present count seam, found {broad.count(present)}')
          broad = broad.replace(unreadable, unreadable_fixed, 1)
          broad = broad.replace(present, present_fixed, 1)
          source = source[:broad_start] + broad + source[broad_end:]

          oversized_start = source.index(
              '#[test]\nfn catalogue_only_oversized_sources_detect_bounded_middle_mutations()'
          )
          oversized_end = source.index(
              '\n#[test]\nfn root_filter_is_applied_before_preferred_location_ranking()',
              oversized_start,
          )
          oversized = source[oversized_start:oversized_end]
          old = '    assert_eq!(asset.availability, "unreadable");'
          new = '    assert_eq!(asset.availability, "present");'
          if oversized.count(old) != 1:
              raise SystemExit(f'expected one oversized availability seam, found {oversized.count(old)}')
          oversized = oversized.replace(old, new, 1)
          source = source[:oversized_start] + oversized + source[oversized_end:]
          scanner.write_text(source)

          integrity = Path('crates/reference-core/tests/v1_schema_integrity.rs')
          integrity_source = integrity.read_text()
          old_ledger_tail = '''            (
                      3,
                      "v1_async_rendition_jobs".into(),
                      "6670bc4e3fc09b0489f8c1f35611df625f5d5b69c394a8ff7fa7576933132c94".into()
                  )
              ]'''
          new_ledger_tail = '''            (
                      3,
                      "v1_async_rendition_jobs".into(),
                      "6670bc4e3fc09b0489f8c1f35611df625f5d5b69c394a8ff7fa7576933132c94".into()
                  ),
                  (
                      4,
                      "asset_browser_feature_parity".into(),
                      "0ea805d7e80ba293de0a86c40ea4a13d67feddcbfe3f725062e49fbce45249cb".into()
                  )
              ]'''
          if integrity_source.count(old_ledger_tail) != 1:
              raise SystemExit(
                  f'expected one schema ledger tail, found {integrity_source.count(old_ledger_tail)}'
              )
          integrity.write_text(integrity_source.replace(old_ledger_tail, new_ledger_tail, 1))
          PY
          cargo fmt --all
          git diff --check

      - name: Verify Rust public seams
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add crates migrations
          git diff --cached --check
          git commit -m "fix(core): separate source truth from preview support"
          git push origin HEAD:codex/reference-library-feature-parity
