name: Brutalist UI clean-room promotion

on:
  push:
    branches:
      - codex/reference-library-brutalist-ui

concurrency:
  group: reference-library-brutalist-ui-promotion
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BRANCH: codex/reference-library-brutalist-clean
      STAGING_BRANCH: codex/reference-library-brutalist-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Recover reviewed repair programs from history
        shell: bash
        run: |
          git fetch origin main codex/reference-library-final-gauntlet-v2
          repair_commit="$(git log --all -n 1 --format=%H -- .github/brutalist-ui-repair.py)"
          test -n "$repair_commit"
          git show "$repair_commit:.github/brutalist-ui-repair.py" > "$RUNNER_TEMP/brutalist-ui-repair.py"
          git show origin/codex/reference-library-final-gauntlet-v2:.github/final-gauntlet-v2-repair.py > "$RUNNER_TEMP/final-gauntlet-v2-repair.py"
      - name: Build one clean product commit from current main
        shell: bash
        run: |
          git checkout -B "$CLEAN_BRANCH" origin/main
          python3 "$RUNNER_TEMP/final-gauntlet-v2-repair.py"
          python3 "$RUNNER_TEMP/brutalist-ui-repair.py"
          node scripts/generate-product-icon.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md \
            assets/branding \
            docs/evidence/DECISION_EVIDENCE_LOG.md \
            docs/product/BRUTALIST_INTERFACE_SYSTEM.md \
            packages/workspace/src \
            scripts/generate-product-icon.mjs
          git diff --cached --check
          git commit -m 'feat: rebuild Reference Library as an oversized brutalist workspace'
          git push --force-with-lease origin "HEAD:refs/heads/$CLEAN_BRANCH"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify source before opening review
        shell: bash
        run: |
          npm ci --ignore-scripts
          python3 scripts/check_repository.py
          node scripts/generate-product-icon.mjs --check
          node scripts/check-release-metadata.mjs
          python3 scripts/generate_dependency_licenses.py --check
          node scripts/legal-bundle-contract.mjs --directory .
          npm run typecheck
          npm test
          npm run build
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          node scripts/t01-semantic-roundtrip.mjs --core target/debug/reference-core
          node scripts/v1-semantic-roundtrip.mjs --core target/debug/reference-core
      - name: Replace staging review with clean product review
        shell: bash
        run: |
          while read -r number; do
            test -z "$number" || gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment 'Superseded by the clean-room product branch.'
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$STAGING_BRANCH" --json number --jq '.[].number')

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$CLEAN_BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$pr_number"; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$CLEAN_BRANCH" \
              --title 'Rebuild Reference Library as an oversized brutalist workspace' \
              --body $'## Product change\n\n- Oversized editorial hierarchy, severe whitespace and thick structural rules.\n- 3.5 rem ordinary control targets: 52.5 px at the default Interface Scale.\n- Figma-like root scaling while thumbnail density and Preview zoom remain independent.\n- Responsive Inspector continuity, modal ownership, Preview focus and stale-detail repairs.\n- Deterministic pitch.dog frame-and-dog mark with generated SVG and 1024 px PNG.\n- Restrained interaction feedback, visible focus and reduced-motion compliance.\n\n## Gate\n\nMerge only after the exact clean branch passes the ordinary five-job repository CI. Target-machine M1, L1, X1 and C1 evidence remains open.'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$CLEAN_BRANCH" --json number --jq '.[0].number')"
          fi
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
      - name: Wait for exact clean-branch CI
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch "$CLEAN_BRANCH" --commit "$PRODUCT_SHA" --limit 1 --json databaseId,status,conclusion 2>/dev/null || true)"
            status="$(jq -r '.[0].status // empty' <<<"$run_json")"
            conclusion="$(jq -r '.[0].conclusion // empty' <<<"$run_json")"
            if test "$status" = completed; then
              test "$conclusion" = success
              run_id="$(jq -r '.[0].databaseId' <<<"$run_json")"
              echo "BRANCH_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact clean-branch CI did not complete inside the bounded promotion window.' >&2
          exit 1
      - name: Squash verified product change into main
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject 'Rebuild Reference Library as an oversized brutalist workspace' \
            --body "Exact clean-branch CI run $BRANCH_RUN_ID passed all five jobs."
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
      - name: Wait for exact-main CI
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --commit "$MAIN_SHA" --limit 1 --json databaseId,status,conclusion 2>/dev/null || true)"
            status="$(jq -r '.[0].status // empty' <<<"$run_json")"
            conclusion="$(jq -r '.[0].conclusion // empty' <<<"$run_json")"
            if test "$status" = completed; then
              test "$conclusion" = success
              echo "Exact-main CI passed at $MAIN_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact-main CI did not complete inside the bounded promotion window.' >&2
          exit 1
      - name: Remove superseded work branches
        if: success()
        shell: bash
        run: |
          for branch in \
            "$STAGING_BRANCH" \
            codex/reference-library-final-gauntlet-v2 \
            codex/reference-library-final-polish \
            codex/reference-library-final-rescue; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
