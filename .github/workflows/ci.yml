name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_repository.py

  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node scripts/t01-semantic-roundtrip.mjs --core target/debug/reference-core

  workspace-and-linux-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: cargo build --locked -p reference-core
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/generate_dependency_licenses.py
      - run: git diff --exit-code -- DEPENDENCY-LICENSES.json

  linux-package-directory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: npm ci
      - run: cargo build --release --locked -p reference-core
      - run: npm run build -w @pitchdog/reference-workspace
      - run: npm run package -w @pitchdog/reference-linux
      - run: test -x release/linux/linux-unpacked/reference-library
      - run: test -x release/linux/linux-unpacked/resources/bin/reference-core
      - run: test -f release/linux/linux-unpacked/resources/app.asar
      - run: test -f release/linux/reference-library-0.1.0-x64.pacman
      - run: test -f release/linux/reference-library-0.1.0-x86_64.AppImage
      - run: test -f release/linux/reference-library-0.1.0-x64.tar.gz
      - run: bsdtar -tf release/linux/reference-library-0.1.0-x64.pacman > "$RUNNER_TEMP/pacman-contents.txt"
      - run: grep -Fxq 'opt/Reference Library/reference-library' "$RUNNER_TEMP/pacman-contents.txt"
      - run: tar -tzf release/linux/reference-library-0.1.0-x64.tar.gz > "$RUNNER_TEMP/tar-contents.txt"
      - run: grep -Fxq 'reference-library-0.1.0-x64/reference-library' "$RUNNER_TEMP/tar-contents.txt"
      - run: >-
          node scripts/write-artifact-receipt.mjs
          --source "$GITHUB_SHA"
          --target linux-x86_64
          --output release/linux/T01_BUILD_RECEIPT.json
          release/linux/reference-library-0.1.0-x64.pacman
          release/linux/reference-library-0.1.0-x86_64.AppImage
          release/linux/reference-library-0.1.0-x64.tar.gz
      - run: node scripts/verify-artifact-receipt.mjs --require-current-target release/linux/T01_BUILD_RECEIPT.json
      - if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-library-linux-x86_64-${{ github.sha }}
          path: |
            release/linux/reference-library-0.1.0-x64.pacman
            release/linux/reference-library-0.1.0-x86_64.AppImage
            release/linux/reference-library-0.1.0-x64.tar.gz
            release/linux/T01_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos-arm64-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin
      - run: npm ci --ignore-scripts
      - run: swift test --package-path apps/macos
      - run: apps/macos/scripts/build-app.sh
      - run: test -f release/macos/reference-library-0.1.0-macos-arm64.app.zip
      - run: shasum -a 256 -c release/macos/reference-library-0.1.0-macos-arm64.app.zip.sha256
      - run: >-
          node scripts/write-artifact-receipt.mjs
          --source "$GITHUB_SHA"
          --target macos-arm64
          --output release/macos/T01_BUILD_RECEIPT.json
          release/macos/reference-library-0.1.0-macos-arm64.app.zip
          release/macos/reference-library-0.1.0-macos-arm64.app.zip.sha256
      - run: node scripts/verify-artifact-receipt.mjs --require-current-target release/macos/T01_BUILD_RECEIPT.json
      - if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-library-macos-arm64-${{ github.sha }}
          path: |
            release/macos/reference-library-0.1.0-macos-arm64.app.zip
            release/macos/reference-library-0.1.0-macos-arm64.app.zip.sha256
            release/macos/T01_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
