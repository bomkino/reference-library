name: Run causal source repair v2

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/run-causal-source-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: reference-library-causal-source-repair-v2
  cancel-in-progress: false

jobs:
  transform-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Execute reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-causal-source-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(script, 'causal-source-repair-v2.py', 'exec'), {'__name__': '__main__'})
          PY
          cargo fmt --all
          git diff --check

      - name: Verify all Rust public seams
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add crates migrations
          git diff --cached --check
          git commit -m "fix(core): separate source truth from preview support"
          git push origin HEAD:codex/reference-library-feature-parity
