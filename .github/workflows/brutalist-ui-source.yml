name: Brutalist UI source snapshot

on:
  push:
    branches:
      - codex/reference-library-brutalist-ui

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archive exact source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/reference-library-source.tgz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-library-source-${{ github.sha }}
          path: ${{ runner.temp }}/reference-library-source.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
