name: Repair migration fixture and retrigger causal verification

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/repair-migration-fixture-and-retrigger.yml

permissions:
  contents: write

concurrency:
  group: reference-library-migration-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Repair only the corrupted fixture seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixture = Path("crates/reference-core/tests/v1_migration_recovery_adversarial.rs")
          source = fixture.read_text()

          duplicate = '''impl Drop for PopulatedPackage {
              fn drop(&mut self) {
                  let _ = fs::remove_dir_all(&self.directory);
              }
          }

          impl Drop for PopulatedPackage {
              fn drop(&mut self) {
                  let _ = fs::remove_dir_all(&self.directory);
              }
          }
          '''
          single = '''impl Drop for PopulatedPackage {
              fn drop(&mut self) {
                  let _ = fs::remove_dir_all(&self.directory);
              }
          }
          '''
          if source.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicated Drop seam, found {source.count(duplicate)}")
          source = source.replace(duplicate, single, 1)

          malformed = '''                params![list]=
                          |row| Ok((
          '''
          corrected = '''                params![expected.asset],
                          |row| Ok((
          '''
          if source.count(malformed) != 1:
              raise SystemExit(f"expected one malformed query_row seam, found {source.count(malformed)}")
          source = source.replace(malformed, corrected, 1)
          fixture.write_text(source)
          PY

          printf '\n# retriggered after repairing corrupted migration fixture\n' >> .github/workflows/fix-protocol-command-layout.yml
          rm -f .github/workflows/repair-migration-fixture-and-retrigger.yml
          git diff --check

      - name: Commit repair and retrigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(test): repair migration fixture corruption"
          git push origin HEAD:codex/reference-library-feature-parity
