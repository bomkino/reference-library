name: Fix protocol command layout

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/fix-protocol-command-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-library-protocol-layout-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact feature-parity head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Bound the expanded query and refresh historical contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path("crates/reference-protocol/src/lib.rs")
          text = protocol.read_text()
          needle = "        query: AssetQuery,\n        #[serde(default)]\n        expected_library_revision: Option<u64>,"
          replacement = "        query: Box<AssetQuery>,\n        #[serde(default)]\n        expected_library_revision: Option<u64>,"
          if text.count(needle) != 1:
              raise SystemExit(f"expected one inline QueryAssetIndex payload, found {text.count(needle)}")
          text = text.replace(needle, replacement, 1)

          assertion = "        assert!(size_of::<Command>() <= 520);"
          diagnostic = (
              "        let command_size = size_of::<Command>();\n"
              "        assert!(\n"
              "            command_size <= 520,\n"
              "            \"Command occupies {command_size} bytes; keep large request payloads indirect\"\n"
              "        );"
          )
          if assertion in text:
              text = text.replace(assertion, diagnostic, 1)
          protocol.write_text(text)

          fixture = Path("crates/reference-core/tests/v1_editorial_public_seams.rs")
          tests = fixture.read_text()
          replacements = [
              (
                  "                note: TextPatch::Set(\" \\n \".into()),\n            },",
                  "                note: TextPatch::Set(\" \\n \".into()),\n                ..AssetPatch::default()\n            },",
              ),
              (
                  "                sort: AssetSort::NameDescending,\n            },",
                  "                sort: AssetSort::NameDescending,\n                ..AssetQuery::default()\n            },",
              ),
              (
                  "        sort: AssetSort::NameDescending,\n    };",
                  "        sort: AssetSort::NameDescending,\n        ..AssetQuery::default()\n    };",
              ),
              (
                  "        library_revision: 1,\n    };",
                  "        library_revision: 1,\n        facets: Default::default(),\n    };",
              ),
          ]
          for old, new in replacements:
              if tests.count(old) != 1:
                  raise SystemExit(f"expected one historical V1 fixture seam, found {tests.count(old)} for {old!r}")
              tests = tests.replace(old, new, 1)
          fixture.write_text(tests)

          tracer = Path("crates/reference-core/tests/t01_public_seams.rs")
          t01 = tracer.read_text()
          t01_replacements = [
              ("fn write_common_stills(&self)", "fn write_common_catalogue(&self)"),
              ("project.write_common_stills();", "project.write_common_catalogue();"),
              (
                  "fn stills_progress_page_preview_reveal_missing_and_round_trip()",
                  "fn catalogue_progress_page_preview_reveal_missing_and_round_trip()",
              ),
              ("    assert_eq!(first_page.total, 3);", "    assert_eq!(first_page.total, 4);"),
              ("    assert_eq!(second_page.items.len(), 1);", "    assert_eq!(second_page.items.len(), 2);"),
              ("    assert_eq!(after_missing.total, 3);", "    assert_eq!(after_missing.total, 4);"),
          ]
          for old, new in t01_replacements:
              if t01.count(old) != 1:
                  raise SystemExit(f"expected one T01 catalogue seam, found {t01.count(old)} for {old!r}")
              t01 = t01.replace(old, new, 1)
          marker = "    assert_eq!(second_page.next_offset, None);\n"
          catalogue_assertion = (
              marker
              + "    assert!(first_page\n"
              + "        .items\n"
              + "        .iter()\n"
              + "        .chain(&second_page.items)\n"
              + "        .any(|item| item.extension.as_deref() == Some(\"txt\")));\n"
          )
          if t01.count(marker) != 1:
              raise SystemExit(f"expected one T01 paging marker, found {t01.count(marker)}")
          t01 = t01.replace(marker, catalogue_assertion, 1)
          tracer.write_text(t01)

          def add_parity_migration(path: str, label: str) -> None:
              file = Path(path)
              source = file.read_text()
              migration_marker = (
                  "const MIGRATION_0003: &str = include_str!(\"../../../migrations/0003_rendition_jobs.sql\");\n"
              )
              migration_replacement = (
                  migration_marker
                  + "const MIGRATION_0004: &str = include_str!(\"../../../migrations/0004_asset_browser_parity.sql\");\n"
              )
              if source.count(migration_marker) != 1:
                  raise SystemExit(f"expected one {label} migration marker, found {source.count(migration_marker)}")
              source = source.replace(migration_marker, migration_replacement, 1)
              apply_marker = "    connection.execute_batch(MIGRATION_0003).unwrap();\n"
              apply_replacement = apply_marker + "    connection.execute_batch(MIGRATION_0004).unwrap();\n"
              if source.count(apply_marker) != 1:
                  raise SystemExit(f"expected one {label} migration application, found {source.count(apply_marker)}")
              source = source.replace(apply_marker, apply_replacement, 1)
              file.write_text(source)

          add_parity_migration(
              "crates/reference-core/tests/v1_bounded_output_adversarial.rs",
              "bounded-output fixture",
          )
          add_parity_migration(
              "crates/reference-core/tests/v1_canonical_public_seams.rs",
              "canonical fixture",
          )
          PY
          rm -f .github/workflows/fix-protocol-command-layout.yml
          cargo fmt --all
          git diff --check

      - name: Verify the causal fix
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(protocol): bound expanded asset queries"
          git push origin HEAD:codex/reference-library-feature-parity
