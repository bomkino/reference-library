name: Fix protocol command layout

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/fix-protocol-command-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-library-protocol-layout-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact feature-parity head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Box the expanded query payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path("crates/reference-protocol/src/lib.rs")
          text = protocol.read_text()
          old = '''    QueryAssetIndex {
              session_id: String,
              offset: u64,
              limit: u32,
              projection: AssetProjection,
              query: AssetQuery,
              #[serde(default)]
              expected_library_revision: Option<u64>,
          },'''
          new = '''    QueryAssetIndex {
              session_id: String,
              offset: u64,
              limit: u32,
              projection: AssetProjection,
              query: Box<AssetQuery>,
              #[serde(default)]
              expected_library_revision: Option<u64>,
          },'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one QueryAssetIndex layout, found {text.count(old)}")
          text = text.replace(old, new, 1)

          assertion = '        assert!(size_of::<Command>() <= 520);'
          diagnostic = '''        let command_size = size_of::<Command>();
                  assert!(
                      command_size <= 520,
                      "Command occupies {command_size} bytes; keep large request payloads indirect"
                  );'''
          if assertion in text:
              text = text.replace(assertion, diagnostic, 1)
          protocol.write_text(text)
          PY
          rm -f .github/workflows/fix-protocol-command-layout.yml
          cargo fmt --all
          git diff --check

      - name: Verify the causal fix
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(protocol): bound expanded asset queries"
          git push origin HEAD:codex/reference-library-feature-parity
