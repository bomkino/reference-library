name: Fix protocol command layout

on:
  push:
    branches:
      - codex/reference-library-feature-parity
    paths:
      - .github/workflows/fix-protocol-command-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-library-protocol-layout-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature-parity head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/reference-library-feature-parity

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Bound query frames and separate source truth from preview capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} reviewed matches, found {count} for {old!r}")
              file.write_text(source.replace(old, new, expected))

          # Keep the expanded faceted query off the Command enum's inline stack footprint.
          replace_exact(
              "crates/reference-protocol/src/lib.rs",
              "        query: AssetQuery,\n        #[serde(default)]\n        expected_library_revision: Option<u64>,",
              "        query: Box<AssetQuery>,\n        #[serde(default)]\n        expected_library_revision: Option<u64>,",
          )
          protocol = Path("crates/reference-protocol/src/lib.rs")
          text = protocol.read_text()
          assertion = "        assert!(size_of::<Command>() <= 520);"
          if assertion in text:
              text = text.replace(
                  assertion,
                  "        let command_size = size_of::<Command>();\n"
                  "        assert!(\n"
                  "            command_size <= 520,\n"
                  "            \"Command occupies {command_size} bytes; keep large request payloads indirect\"\n"
                  "        );",
                  1,
              )
          protocol.write_text(text)

          # A source can be physically readable while lacking an in-app renderer.
          # Preserve location truth separately from preview capability.
          replace_exact(
              "crates/reference-core/src/editorial.rs",
              "                     WHEN l.state = 'unreadable' THEN 'unsupported'\n"
              "                     ELSE l.state",
              "                     WHEN l.state = 'unreadable' THEN 'unreadable'\n"
              "                     WHEN json_extract(sr.media_metadata_json, '$.previewKind') = 'none'\n"
              "                          THEN 'unsupported'\n"
              "                     ELSE l.state",
              expected=2,
          )

          discovery = Path("crates/reference-core/src/discovery.rs")
          source = discovery.read_text()
          field_marker = (
              "    platform_link_count: Option<u64>,\n"
              "    mime_type: String,"
          )
          field_replacement = (
              "    platform_link_count: Option<u64>,\n"
              "    location_state: &'static str,\n"
              "    mime_type: String,"
          )
          if source.count(field_marker) != 1:
              raise SystemExit(f"discovery FileCandidate field marker count: {source.count(field_marker)}")
          source = source.replace(field_marker, field_replacement, 1)

          grid_marker = "        let grid_servable = kind.grid_candidate\n"
          grid_replacement = (
              "        let location_state = if kind.dimension_probe\n"
              "            && eligible_size\n"
              "            && dimensions.is_none()\n"
              "        {\n"
              "            \"unreadable\"\n"
              "        } else {\n"
              "            \"present\"\n"
              "        };\n"
              "        let grid_servable = kind.grid_candidate\n"
          )
          if source.count(grid_marker) != 2:
              raise SystemExit(f"discovery dimension-state marker count: {source.count(grid_marker)}")
          source = source.replace(grid_marker, grid_replacement)

          init_marker = (
              "            platform_link_count,\n"
              "            mime_type: kind.mime_type.into(),"
          )
          init_replacement = (
              "            platform_link_count,\n"
              "            location_state,\n"
              "            mime_type: kind.mime_type.into(),"
          )
          if source.count(init_marker) != 2:
              raise SystemExit(f"discovery FileCandidate initializer count: {source.count(init_marker)}")
          source = source.replace(init_marker, init_replacement)

          conflated_state = (
              "    let location_state = if candidate.preview_kind == \"none\" {\n"
              "        \"unreadable\"\n"
              "    } else {\n"
              "        \"present\"\n"
              "    };\n"
          )
          if source.count(conflated_state) != 2:
              raise SystemExit(f"discovery conflated location-state count: {source.count(conflated_state)}")
          source = source.replace(conflated_state, "")

          refresh_param = "            location_state,\n            candidate.relative_display,"
          insert_param = "            location_state,\n            candidate.byte_size as i64,"
          if source.count(refresh_param) != 1 or source.count(insert_param) != 1:
              raise SystemExit("discovery persisted location-state markers changed")
          source = source.replace(
              refresh_param,
              "            candidate.location_state,\n            candidate.relative_display,",
              1,
          )
          source = source.replace(
              insert_param,
              "            candidate.location_state,\n            candidate.byte_size as i64,",
              1,
          )
          discovery.write_text(source)

          # Refresh historical V1 fixtures for the feature-parity protocol fields.
          fixture = Path("crates/reference-core/tests/v1_editorial_public_seams.rs")
          tests = fixture.read_text()
          replacements = [
              (
                  "                note: TextPatch::Set(\" \\n \".into()),\n            },",
                  "                note: TextPatch::Set(\" \\n \".into()),\n                ..AssetPatch::default()\n            },",
              ),
              (
                  "                sort: AssetSort::NameDescending,\n            },",
                  "                sort: AssetSort::NameDescending,\n                ..AssetQuery::default()\n            },",
              ),
              (
                  "        sort: AssetSort::NameDescending,\n    };",
                  "        sort: AssetSort::NameDescending,\n        ..AssetQuery::default()\n    };",
              ),
              (
                  "        library_revision: 1,\n    };",
                  "        library_revision: 1,\n        facets: Default::default(),\n    };",
              ),
          ]
          for old, new in replacements:
              if tests.count(old) != 1:
                  raise SystemExit(f"editorial fixture: expected one match for {old!r}, found {tests.count(old)}")
              tests = tests.replace(old, new, 1)

          availability_start = tests.index(
              "#[test]\nfn every_availability_filter_projects_durable_root_and_location_truth()"
          )
          availability_end = tests.index(
              "\n#[test]\nfn paged_asset_query_rejects_a_mixed_library_generation()",
              availability_start,
          )
          availability = tests[availability_start:availability_end]
          availability = availability.replace(
              "for (root_state, location_state, mime, filter, expected) in [",
              "for (root_state, location_state, mime, preview_kind, filter, expected) in [",
              1,
          )
          image_marker = '            "image/png",\n            AvailabilityFilter'
          if availability.count(image_marker) != 6:
              raise SystemExit(f"availability image tuple count: {availability.count(image_marker)}")
          availability = availability.replace(
              image_marker,
              '            "image/png",\n            "image",\n            AvailabilityFilter',
          )
          unsupported_tuple = (
              "        (\n"
              "            \"ready\",\n"
              "            \"unreadable\",\n"
              "            \"image/gif\",\n"
              "            AvailabilityFilter::Unsupported,\n"
              "            \"unsupported\",\n"
              "        ),"
          )
          unsupported_replacement = (
              "        (\n"
              "            \"ready\",\n"
              "            \"present\",\n"
              "            \"image/vnd.adobe.photoshop\",\n"
              "            \"none\",\n"
              "            AvailabilityFilter::Unsupported,\n"
              "            \"unsupported\",\n"
              "        ),"
          )
          if availability.count(unsupported_tuple) != 1:
              raise SystemExit("availability unsupported tuple changed")
          availability = availability.replace(unsupported_tuple, unsupported_replacement, 1)
          revision_update = (
              "                \"UPDATE source_revisions SET mime_detected=?1 WHERE id=(\n"
              "                   SELECT current_revision_id FROM sources LIMIT 1\n"
              "                 )\",\n"
              "                [mime],"
          )
          revision_replacement = (
              "                \"UPDATE source_revisions\n"
              "                 SET mime_detected=?1,\n"
              "                     media_metadata_json=json_set(\n"
              "                         media_metadata_json, '$.previewKind', ?2\n"
              "                     )\n"
              "                 WHERE id=(\n"
              "                   SELECT current_revision_id FROM sources LIMIT 1\n"
              "                 )\",\n"
              "                params![mime, preview_kind],"
          )
          if availability.count(revision_update) != 1:
              raise SystemExit("availability revision update changed")
          availability = availability.replace(revision_update, revision_replacement, 1)
          tests = tests[:availability_start] + availability + tests[availability_end:]
          fixture.write_text(tests)

          # T01 now proves broad catalogue semantics, including a text reference.
          tracer = Path("crates/reference-core/tests/t01_public_seams.rs")
          t01 = tracer.read_text()
          t01_replacements = [
              ("fn write_common_stills(&self)", "fn write_common_catalogue(&self)"),
              ("project.write_common_stills();", "project.write_common_catalogue();"),
              (
                  "fn stills_progress_page_preview_reveal_missing_and_round_trip()",
                  "fn catalogue_progress_page_preview_reveal_missing_and_round_trip()",
              ),
              ("    assert_eq!(first_page.total, 3);", "    assert_eq!(first_page.total, 4);"),
              ("    assert_eq!(second_page.items.len(), 1);", "    assert_eq!(second_page.items.len(), 2);"),
              ("    assert_eq!(after_missing.total, 3);", "    assert_eq!(after_missing.total, 4);"),
          ]
          for old, new in t01_replacements:
              if t01.count(old) != 1:
                  raise SystemExit(f"T01 fixture: expected one match for {old!r}, found {t01.count(old)}")
              t01 = t01.replace(old, new, 1)
          marker = "    assert_eq!(second_page.next_offset, None);\n"
          catalogue_assertion = (
              marker
              + "    assert!(first_page\n"
              + "        .items\n"
              + "        .iter()\n"
              + "        .chain(&second_page.items)\n"
              + "        .any(|item| item.extension.as_deref() == Some(\"txt\")));\n"
          )
          if t01.count(marker) != 1:
              raise SystemExit(f"T01 paging marker count: {t01.count(marker)}")
          t01 = t01.replace(marker, catalogue_assertion, 1)
          tracer.write_text(t01)

          # Hand-built canonical fixtures must execute the current durable schema.
          def add_parity_migration(path: str, label: str) -> None:
              file = Path(path)
              source = file.read_text()
              migration_marker = (
                  "const MIGRATION_0003: &str = include_str!(\"../../../migrations/0003_rendition_jobs.sql\");\n"
              )
              migration_replacement = (
                  migration_marker
                  + "const MIGRATION_0004: &str = include_str!(\"../../../migrations/0004_asset_browser_parity.sql\");\n"
              )
              if source.count(migration_marker) != 1:
                  raise SystemExit(f"{label}: migration marker count {source.count(migration_marker)}")
              source = source.replace(migration_marker, migration_replacement, 1)
              apply_marker = "    connection.execute_batch(MIGRATION_0003).unwrap();\n"
              apply_replacement = apply_marker + "    connection.execute_batch(MIGRATION_0004).unwrap();\n"
              if source.count(apply_marker) != 1:
                  raise SystemExit(f"{label}: migration application count {source.count(apply_marker)}")
              source = source.replace(apply_marker, apply_replacement, 1)
              file.write_text(source)

          add_parity_migration(
              "crates/reference-core/tests/v1_bounded_output_adversarial.rs",
              "bounded-output fixture",
          )
          add_parity_migration(
              "crates/reference-core/tests/v1_canonical_public_seams.rs",
              "canonical fixture",
          )

          # Scanner proof: corrupt stills are unreadable; readable catalogue-only
          # design files are unsupported; browser-native GIF remains physically present.
          scanner = Path("crates/reference-core/tests/v1_root_scanner_public_seams.rs")
          scan_tests = scanner.read_text()
          scan_start = scan_tests.index(
              "#[test]\nfn unsupported_and_corrupt_stills_remain_catalogued_with_distinct_truth()"
          )
          scan_end = scan_tests.index(
              "\n#[test]\nfn full_streaming_evidence_catches_middle_rewrite_but_touch_only_keeps_revision()",
              scan_start,
          )
          scan = scan_tests[scan_start:scan_end]
          scan = scan.replace(
              "fn unsupported_and_corrupt_stills_remain_catalogued_with_distinct_truth()",
              "fn broad_catalogue_preserves_supported_unsupported_and_corrupt_truth()",
              1,
          )
          extension_write = '    fs::write(root.join("extension-only.png"), b"not image bytes").unwrap();\n'
          if scan.count(extension_write) != 1:
              raise SystemExit("root-scanner extension fixture changed")
          scan = scan.replace(
              extension_write,
              extension_write
              + '    fs::write(root.join("layout.psd"), b"8BPS catalogue-only payload").unwrap();\n',
              1,
          )
          scan = scan.replace("    assert_eq!(root_summary.observed_count, 4);", "    assert_eq!(root_summary.observed_count, 5);", 1)
          scan = scan.replace("    assert_eq!(root_summary.unsupported_count, 3);", "    assert_eq!(root_summary.unsupported_count, 1);", 1)
          if scan.count("    assert_eq!(page.total, 4);") != 2:
              raise SystemExit(f"root-scanner page total count: {scan.count('    assert_eq!(page.total, 4);')}")
          scan = scan.replace("    assert_eq!(page.total, 4);", "    assert_eq!(page.total, 5);")
          unsupported_assertion = (
              "    assert_eq!(\n"
              "        page.items\n"
              "            .iter()\n"
              "            .filter(|asset| asset.availability == \"unsupported\")\n"
              "            .count(),\n"
              "        1\n"
              "    );\n"
          )
          present_assertion = (
              unsupported_assertion
              + "    assert_eq!(\n"
              + "        page.items\n"
              + "            .iter()\n"
              + "            .filter(|asset| asset.availability == \"present\")\n"
              + "            .count(),\n"
              + "        2\n"
              + "    );\n"
          )
          if scan.count(unsupported_assertion) != 1:
              raise SystemExit("root-scanner unsupported assertion changed")
          scan = scan.replace(unsupported_assertion, present_assertion, 1)
          scan_tests = scan_tests[:scan_start] + scan + scan_tests[scan_end:]
          scanner.write_text(scan_tests)
          PY
          rm -f .github/workflows/fix-protocol-command-layout.yml
          cargo fmt --all
          git diff --check

      - name: Verify the causal fix
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): separate source truth from preview support"
          git push origin HEAD:codex/reference-library-feature-parity
