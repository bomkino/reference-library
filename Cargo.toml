[workspace]
members = [
    "crates/reference-protocol",
    "crates/reference-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/bomkino/reference-library"

[workspace.dependencies]
imagesize = "0.15.0"
libc = "0.2.177"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.16"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
